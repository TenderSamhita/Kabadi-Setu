name: kabadi_setu
description: "Offline-first e-waste collection app — SIH PS 26229 prototype."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.2

  # Voice
  flutter_tts: ^4.2.1

  # QR generation
  qr_flutter: ^4.1.0

  # QR scanning
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/seed/categories.json
    - assets/seed/recyclers.json
    - assets/logo.png
