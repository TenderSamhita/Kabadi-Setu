<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "outline": "#817663", "on-primary": "#ffffff", "on-tertiary-fixed": "#002112", "on-tertiary-fixed-variant": "#0b5134", "alert": "#A93325", "on-background": "#191c1a", "surface-dim": "#d8dbd7", "on-primary-fixed-variant": "#5d4200", "inverse-on-surface": "#eff1ed", "signal": "#2F6E4E", "secondary": "#51625c", "surface-container": "#eceeea", "surface-container-high": "#e7e9e5", "boardDeep": "#132019", "surface-tint": "#7b5900", "tertiary-container": "#67a682", "secondary-fixed-dim": "#b8cbc3", "tertiary-fixed-dim": "#94d5ae", "surface-bright": "#f8faf6", "on-error-container": "#93000a", "on-surface-variant": "#4f4535", "ink": "#1A231F", "primary-container": "#c2911e", "error": "#ba1a1a", "inkSoft": "#4E5A53", "rule": "#CBD2CB", "secondary-container": "#d4e7df", "on-tertiary": "#ffffff", "on-secondary-fixed": "#0f1f1a", "surface": "#f8faf6", "secondary-fixed": "#d4e7df", "on-tertiary-container": "#003922", "on-secondary-container": "#576862", "tertiary-fixed": "#aff1c9", "paper": "#ECEEEA", "board": "#1B2B26", "chalk": "#F1F3EC", "card": "#F7F8F4", "brass": "#C2911E", "surface-variant": "#e1e3df", "error-container": "#ffdad6", "outline-variant": "#d3c5af", "primary-fixed-dim": "#f5be4a", "surface-container-low": "#f2f4f0", "on-primary-container": "#422e00", "on-secondary-fixed-variant": "#3a4a45", "surface-container-lowest": "#ffffff", "background": "#f8faf6", "on-error": "#ffffff", "on-primary-fixed": "#261900", "primary-fixed": "#ffdea4", "inverse-surface": "#2e312f", "tertiary": "#2a6a4a", "on-surface": "#191c1a", "surface-container-highest": "#e1e3df", "inverse-primary": "#f5be4a", "primary": "#7b5900", "on-secondary": "#ffffff" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "space-sm": "0.75rem", "space-xl": "2rem", "margin": "1rem", "space-lg": "1.5rem", "space-xs": "0.375rem", "gutter": "1rem", "space-md": "1rem" }, fontFamily: { "body-lg": ["Noto Sans"], "display-hero": ["Noto Sans"], "headline-md": ["Noto Sans"], "body-base": ["Noto Sans"], "headline-lg": ["Noto Sans"], "numeral-md": ["Noto Sans"], "label-secondary": ["Noto Sans"], "display-hero-mobile": ["Noto Sans"], "numeral-lg": ["Noto Sans"], "label-primary": ["Noto Sans"] }, fontSize: { "body-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }], "display-hero": ["48px", { "lineHeight": "56px", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "30px", "fontWeight": "600" }], "body-base": ["18px", { "lineHeight": "26px", "fontWeight": "400" }], "headline-lg": ["26px", { "lineHeight": "34px", "fontWeight": "700" }], "numeral-md": ["30px", { "lineHeight": "38px", "fontWeight": "700" }], "label-secondary": ["16px", { "lineHeight": "22px", "fontWeight": "500" }], "display-hero-mobile": ["38px", { "lineHeight": "46px", "fontWeight": "700" }], "numeral-lg": ["36px", { "lineHeight": "44px", "fontWeight": "700" }], "label-primary": ["18px", { "lineHeight": "24px", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#ECEEEA;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-paper font-body-base text-body-base text-ink flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-paper min-h-screen"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Brand & Identity Surface -->
<div class="flex flex-col items-center justify-center text-center bg-board rounded-xl p-space-lg shadow-md mt-space-sm mb-space-md">
<!-- Emblem: Dual Recycling Loop & Tactile Handshake Mark -->
<div class="relative w-24 h-24 mb-space-md flex items-center justify-center">
<svg aria-hidden="true" class="w-full h-full" fill="none" viewbox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
<!-- Dual Recycling Arrows -->
<path d="M48 8A40 40 0 0 1 88 48C88 56.4 85.4 64.2 81 70.6L74 65.2C77.2 60.2 79 54.3 79 48C79 30.9 65.1 17 48 17V26L32 13L48 0V8Z" fill="#C2911E"></path>
<path d="M48 88A40 40 0 0 1 8 48C8 39.6 10.6 31.8 15 25.4L22 30.8C18.8 35.8 17 41.7 17 48C17 65.1 30.9 79 48 79V70L64 83L48 96V88Z" fill="#2F6E4E"></path>
<!-- Handshake / Direct Settlement Geometry -->
<path d="M34 46L44 36C45.6 34.4 48.2 34.4 49.8 36L52 38.2C53.6 39.8 53.6 42.4 52 44L47 49M62 46L52 56C50.4 57.6 47.8 57.6 46.2 56L44 53.8C42.4 52.2 42.4 49.6 44 48L49 43" stroke="#F1F3EC" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"></path>
<circle cx="48" cy="48" fill="#C2911E" r="4"></circle>
</svg>
</div>
<!-- Main Headings -->
<h1 class="font-headline-lg text-headline-lg text-chalk tracking-tight">
      कबाडी सेतू / Kabadi Setu
    </h1>
<p class="font-label-primary text-label-primary text-primary-fixed-dim mt-space-xs">
      ई-कचरा थेट विक्री केंद्र
    </p>
<!-- Context pill for visual clarity -->
<div class="inline-flex items-center gap-2 bg-boardDeep px-3 py-1.5 rounded-full mt-space-md">
<span class="w-2.5 h-2.5 rounded-full bg-signal inline-block animate-pulse"></span>
<span class="font-label-secondary text-label-secondary text-surface-variant">भाषा निवडा / भाषा चुनें</span>
</div>
</div>
<!-- Utilitarian Language Action Stack -->
<div class="flex flex-col gap-space-md w-full">
<!-- Option 1: Marathi -->
<div class="relative flex items-stretch w-full rounded-xl bg-card shadow-sm overflow-hidden active:bg-surface-container transition-colors">
<button aria-label="मराठी निवडा / Select Marathi" class="flex-1 min-h-[76px] flex items-center justify-start px-space-lg text-left" onclick="selectLanguage('mr')" type="button">
<div class="flex flex-col">
<span class="font-headline-lg text-headline-lg text-ink">मराठी</span>
<span class="font-label-secondary text-label-secondary text-inkSoft">Marathi</span>
</div>
</button>
<!-- Tactile Audio Pronunciation Trigger -->
<button aria-label="मराठी ऑडिओ ऐका" class="w-[68px] min-h-[76px] flex items-center justify-center bg-secondary-container text-ink active:bg-primary-fixed-dim transition-colors" onclick="playAudioCue('मराठी', this)" type="button">
<span class="material-symbols-outlined text-[32px] speaker-icon">volume_up</span>
</button>
</div>
<!-- Option 2: Hindi -->
<div class="relative flex items-stretch w-full rounded-xl bg-card shadow-sm overflow-hidden active:bg-surface-container transition-colors">
<button aria-label="हिंदी चुनें / Select Hindi" class="flex-1 min-h-[76px] flex items-center justify-start px-space-lg text-left" onclick="selectLanguage('hi')" type="button">
<div class="flex flex-col">
<span class="font-headline-lg text-headline-lg text-ink">हिंदी</span>
<span class="font-label-secondary text-label-secondary text-inkSoft">Hindi</span>
</div>
</button>
<!-- Tactile Audio Pronunciation Trigger -->
<button aria-label="हिंदी ऑडियो सुनें" class="w-[68px] min-h-[76px] flex items-center justify-center bg-secondary-container text-ink active:bg-primary-fixed-dim transition-colors" onclick="playAudioCue('हिंदी', this)" type="button">
<span class="material-symbols-outlined text-[32px] speaker-icon">volume_up</span>
</button>
</div>
</div>
<!-- Direct Assistance & Status Footer -->
<div class="mt-space-lg flex flex-col items-center justify-center p-space-md rounded-xl bg-surface-container-high text-center">
<div class="flex items-center gap-2 text-inkSoft mb-1">
<span class="material-symbols-outlined text-[20px] text-brass">headset_mic</span>
<span class="font-label-secondary text-label-secondary font-semibold">मदत केंद्र / सहायता केंद्र</span>
</div>
<span class="font-label-secondary text-label-secondary text-inkSoft">
      थेट संपर्क: १८००-२३३-५५५५ (टोल फ्री)
    </span>
</div>
</div>
<script>
  function playAudioCue(lang, triggerBtn) {
    const icon = triggerBtn.querySelector('.speaker-icon');
    if (icon) {
      icon.style.transform = 'scale(1.25)';
      icon.style.color = '#7B5900';
      setTimeout(() => {
        icon.style.transform = 'scale(1)';
        icon.style.color = '';
      }, 350);
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(lang);
      utterance.lang = lang === 'मराठी' ? 'mr-IN' : 'hi-IN';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  function selectLanguage(code) {
    try {
      localStorage.setItem('kabadi_setu_locale', code);
    } catch (e) {}
    
    const banner = document.createElement('div');
    banner.className = 'fixed bottom-6 left-4 right-4 bg-boardDeep text-chalk p-4 rounded-xl flex items-center justify-between shadow-xl z-50';
    banner.innerHTML = `
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-brass">check_circle</span>
        <span class="font-label-primary text-label-primary">${code === 'mr' ? 'मराठी निवडले आहे...' : 'हिंदी चुनी गई है...'}</span>
      </div>
      <span class="font-label-secondary text-label-secondary text-primary-fixed-dim">लोड होत आहे</span>
    `;
    document.body.appendChild(banner);
    setTimeout(() => {
      banner.remove();
    }, 1800);
  }
</script></main></body></html>
