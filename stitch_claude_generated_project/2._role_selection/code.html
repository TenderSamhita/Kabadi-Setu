<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "outline": "#817663", "on-primary": "#ffffff", "on-tertiary-fixed": "#002112", "on-tertiary-fixed-variant": "#0b5134", "alert": "#A93325", "on-background": "#191c1a", "surface-dim": "#d8dbd7", "on-primary-fixed-variant": "#5d4200", "inverse-on-surface": "#eff1ed", "signal": "#2F6E4E", "secondary": "#51625c", "surface-container": "#eceeea", "surface-container-high": "#e7e9e5", "boardDeep": "#132019", "surface-tint": "#7b5900", "tertiary-container": "#67a682", "secondary-fixed-dim": "#b8cbc3", "tertiary-fixed-dim": "#94d5ae", "surface-bright": "#f8faf6", "on-error-container": "#93000a", "on-surface-variant": "#4f4535", "ink": "#1A231F", "primary-container": "#c2911e", "error": "#ba1a1a", "inkSoft": "#4E5A53", "rule": "#CBD2CB", "secondary-container": "#d4e7df", "on-tertiary": "#ffffff", "on-secondary-fixed": "#0f1f1a", "surface": "#f8faf6", "secondary-fixed": "#d4e7df", "on-tertiary-container": "#003922", "on-secondary-container": "#576862", "tertiary-fixed": "#aff1c9", "paper": "#ECEEEA", "board": "#1B2B26", "chalk": "#F1F3EC", "card": "#F7F8F4", "brass": "#C2911E", "surface-variant": "#e1e3df", "error-container": "#ffdad6", "outline-variant": "#d3c5af", "primary-fixed-dim": "#f5be4a", "surface-container-low": "#f2f4f0", "on-primary-container": "#422e00", "on-secondary-fixed-variant": "#3a4a45", "surface-container-lowest": "#ffffff", "background": "#f8faf6", "on-error": "#ffffff", "on-primary-fixed": "#261900", "primary-fixed": "#ffdea4", "inverse-surface": "#2e312f", "tertiary": "#2a6a4a", "on-surface": "#191c1a", "surface-container-highest": "#e1e3df", "inverse-primary": "#f5be4a", "primary": "#7b5900", "on-secondary": "#ffffff" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "space-sm": "0.75rem", "space-xl": "2rem", "margin": "1rem", "space-lg": "1.5rem", "space-xs": "0.375rem", "gutter": "1rem", "space-md": "1rem" }, fontFamily: { "body-lg": ["Noto Sans"], "display-hero": ["Noto Sans"], "headline-md": ["Noto Sans"], "body-base": ["Noto Sans"], "headline-lg": ["Noto Sans"], "numeral-md": ["Noto Sans"], "label-secondary": ["Noto Sans"], "display-hero-mobile": ["Noto Sans"], "numeral-lg": ["Noto Sans"], "label-primary": ["Noto Sans"] }, fontSize: { "body-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }], "display-hero": ["48px", { "lineHeight": "56px", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "30px", "fontWeight": "600" }], "body-base": ["18px", { "lineHeight": "26px", "fontWeight": "400" }], "headline-lg": ["26px", { "lineHeight": "34px", "fontWeight": "700" }], "numeral-md": ["30px", { "lineHeight": "38px", "fontWeight": "700" }], "label-secondary": ["16px", { "lineHeight": "22px", "fontWeight": "500" }], "display-hero-mobile": ["38px", { "lineHeight": "46px", "fontWeight": "700" }], "numeral-lg": ["36px", { "lineHeight": "44px", "fontWeight": "700" }], "label-primary": ["18px", { "lineHeight": "24px", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#ECEEEA;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-paper font-body-base text-body-base text-ink flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-paper min-h-screen"><div class="flex flex-col w-full px-margin pb-6 text-chalk">
<!-- Offline Status Strip -->
<div class="w-full bg-boardDeep rounded-xl px-4 py-2.5 mb-5 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-signal inline-block animate-pulse"></span>
<span class="font-label-secondary text-label-secondary text-chalk/90">ऑफलाइन तयार / Offline Ready</span>
</div>
<span class="font-label-secondary text-label-secondary text-brass flex items-center gap-1 font-semibold">
<span class="material-symbols-outlined text-[18px]">sync</span>
      0 सिंक
    </span>
</div>
<!-- Screen Header with Audio Cue Prompt -->
<div class="w-full bg-board rounded-xl p-space-md mb-6 shadow-md flex items-start justify-between gap-3">
<div class="flex flex-col flex-1 min-w-0">
<span class="font-label-secondary text-label-secondary text-brass uppercase tracking-wide mb-1 font-semibold">
        पायरी २ / STEP 2
      </span>
<h1 class="font-headline-lg text-headline-lg text-chalk leading-tight">
        तुमची भूमिका निवडा
      </h1>
<span class="font-headline-md text-headline-md text-chalk/80 mt-0.5">
        अपनी भूमिका चुनें
      </span>
<span class="font-label-secondary text-label-secondary text-chalk/60 mt-1">
        Select your field role to continue
      </span>
</div>
<!-- 48dp tactile audio speaker cue -->
<button aria-label="Play audio instruction" class="w-12 h-12 rounded-xl bg-boardDeep text-brass flex items-center justify-center active:scale-95 transition-transform flex-shrink-0 shadow-sm" id="audio-prompt-btn" onclick="playVoiceCue()" type="button">
<span class="material-symbols-outlined text-[26px]" id="speaker-icon">volume_up</span>
</button>
</div>
<!-- Role Selection Grid: High-contrast touch zones -->
<div aria-label="Role Selection" class="grid grid-cols-2 gap-space-md w-full mb-6" role="radiogroup">
<!-- Collector Role Card (Selected by Default) -->
<button aria-checked="true" class="group relative flex flex-col items-center justify-between p- space-md rounded-xl bg-card text-ink min-h-[220px] transition-all duration-150 active:scale-98 shadow-md text-center" id="role-collector" onclick="selectRole('collector')" role="radio" style="box-shadow: 0 0 0 3px #C2911E;" type="button">
<!-- Active Stamp / Indicator -->
<div class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-brass text-boardDeep flex items-center justify-center font-bold" id="check-collector">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center mt-3 text-primary-container">
<!-- Hand-cart / collector symbol -->
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">electric_rickshaw</span>
</div>
<div class="w-full flex flex-col items-center mt-3 mb-1">
<span class="font-headline-md text-headline-md text-ink font-bold leading-tight">
          संग्राहक
        </span>
<span class="font-label-primary text-label-primary text-inkSoft mt-0.5 font-semibold">
          Collector
        </span>
<div class="mt-2 bg-paper text-inkSoft px-2.5 py-1 rounded font-label-secondary text-label-secondary">
          फेरीवाला / कबाड़ी
        </div>
</div>
</button>
<!-- Recycler Role Card -->
<button aria-checked="false" class="group relative flex flex-col items-center justify-between p-space-md rounded-xl bg-card text-ink min-h-[220px] transition-all duration-150 active:scale-98 shadow-sm text-center opacity-85" id="role-recycler" onclick="selectRole('recycler')" role="radio" style="box-shadow: none;" type="button">
<!-- Active Stamp / Indicator -->
<div class="hidden absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-brass text-boardDeep items-center justify-center font-bold" id="check-recycler">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mt-3 text-secondary">
<!-- Recycling plant / industrial warehouse scale icon -->
<span class="material-symbols-outlined text-[40px]">factory</span>
</div>
<div class="w-full flex flex-col items-center mt-3 mb-1">
<span class="font-headline-md text-headline-md text-ink font-bold leading-tight">
          पुनर्चक्रणकर्ता
        </span>
<span class="font-label-primary text-label-primary text-inkSoft mt-0.5 font-semibold">
          Recycler
        </span>
<div class="mt-2 bg-paper text-inkSoft px-2.5 py-1 rounded font-label-secondary text-label-secondary">
          कारखाना / यार्ड
        </div>
</div>
</button>
</div>
<!-- Role Context Card (Physical utilitarian register feel) -->
<div class="w-full bg-board rounded-xl p-space-md shadow-sm mb-6 flex items-start gap-3.5">
<div class="w-9 h-9 rounded-full bg-chalk/10 flex items-center justify-center flex-shrink-0 text-brass mt-0.5">
<span class="material-symbols-outlined text-[22px]">info</span>
</div>
<div class="flex-1 min-w-0">
<div class="font-label-primary text-label-primary text-chalk font-semibold" id="role-desc-title">
        संग्राहक मोड / Collector Mode
      </div>
<div class="font-label-secondary text-label-secondary text-chalk/70 mt-0.5" id="role-desc-body">
        वजन नोंदवा, त्वरित दर तपासा आणि रोख पावती मिळवा.
      </div>
</div>
</div>
<!-- Photo Proof / Field Context Asset -->
<div class="w-full bg-boardDeep rounded-xl p-3 shadow-inner mb-6 flex items-center gap-3">
<img class="w-16 h-16 rounded-lg object-cover flex-shrink-0" data-alt="Close-up documentary shot of an informal e-waste aggregator sorting printed circuit boards and copper wires into weighing bins under natural harsh outdoor daylight. Earthy olive green tones and durable workshop aesthetic with dust and tactile brass balances." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCv1vTIafC60GoAUqGdBiNoNy7SSAQqbSvf_y5XQvjO67SqtyQK6jUZP-AOLoQt5JVIs8qRo77R4AVjx0JPHZunfaRrD6yiBdE1boHTyYOQS7iZ4pWYhlp_N3QCEC6W_CbdSlTRNFh96B9fc1fXrF4vSVlR8FJp1Ym3avapkN19O0AJgqEcUIadw4KQyKkOtqr9FuQfqfoxJdat-pjwbOdnbOW434kmJSUeuNKJA02h6C0Xusz-8va9"/>
<div class="flex-1 min-w-0">
<p class="font-label-secondary text-label-secondary text-chalk font-medium truncate">
        दैनिक बाजार भाव थेट जोडले
      </p>
<p class="font-label-secondary text-label-secondary text-brass truncate">
        Daily mandi rates active • 12 केंद्र
      </p>
</div>
</div>
<!-- Grounded Primary Sticky Action Button (Exactly 64dp high) -->
<div class="w-full pt-2">
<button class="w-full h-16 rounded-xl bg-brass text-ink font-headline-md text-headline-md flex items-center justify-center gap-3 shadow-lg active:bg-on-primary-fixed-variant active:text-chalk transition-colors font-bold tracking-tight" id="submit-role-btn" onclick="proceedToDashboard()" type="button">
<span>पुढे जा / आगे बढ़ें</span>
<span class="material-symbols-outlined text-[28px] font-bold">arrow_forward</span>
</button>
</div>
</div>
<script>
  let currentRole = 'collector';

  function selectRole(role) {
    currentRole = role;
    const collectorCard = document.getElementById('role-collector');
    const recyclerCard = document.getElementById('role-recycler');
    const checkCollector = document.getElementById('check-collector');
    const checkRecycler = document.getElementById('check-recycler');
    const descTitle = document.getElementById('role-desc-title');
    const descBody = document.getElementById('role-desc-body');

    if (role === 'collector') {
      collectorCard.style.boxShadow = '0 0 0 3px #C2911E';
      collectorCard.classList.remove('opacity-85');
      checkCollector.classList.remove('hidden');
      checkCollector.classList.add('flex');
      collectorCard.setAttribute('aria-checked', 'true');

      recyclerCard.style.boxShadow = 'none';
      recyclerCard.classList.add('opacity-85');
      checkRecycler.classList.add('hidden');
      checkRecycler.classList.remove('flex');
      recyclerCard.setAttribute('aria-checked', 'false');

      descTitle.innerText = 'संग्राहक मोड / Collector Mode';
      descBody.innerText = 'वजन नोंदवा, त्वरित दर तपासा आणि रोख पावती मिळवा.';
    } else {
      recyclerCard.style.boxShadow = '0 0 0 3px #C2911E';
      recyclerCard.classList.remove('opacity-85');
      checkRecycler.classList.remove('hidden');
      checkRecycler.classList.add('flex');
      recyclerCard.setAttribute('aria-checked', 'true');

      collectorCard.style.boxShadow = 'none';
      collectorCard.classList.add('opacity-85');
      checkCollector.classList.add('hidden');
      checkCollector.classList.remove('flex');
      collectorCard.setAttribute('aria-checked', 'false');

      descTitle.innerText = 'पुनर्चक्रणकर्ता मोड / Recycler Mode';
      descBody.innerText = 'मोठ्या बॅचचे वजन स्वीकारा, जीएसटी बिल तयार करा आणि स्टॉक अपडेट करा.';
    }
  }

  function playVoiceCue() {
    const speaker = document.getElementById('speaker-icon');
    speaker.classList.add('scale-125', 'text-chalk');
    setTimeout(() => {
      speaker.classList.remove('scale-125', 'text-chalk');
    }, 600);
  }

  function proceedToDashboard() {
    const btn = document.getElementById('submit-role-btn');
    btn.classList.add('opacity-90');
    setTimeout(() => {
      btn.classList.remove('opacity-90');
    }, 200);
  }
</script></main></body></html>
